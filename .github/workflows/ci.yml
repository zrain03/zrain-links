
name: Java CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: ./mvnw -B clean verify

      - name: Test Cloudflare link validation
        run: node --test cloudflare/test/*.test.js
      - name: Check browser JavaScript and Firebase configuration
        run: |
          node --check cloudflare/public/app.js
          node --check cloudflare/src/index.js
          node -e "const x=require('./firebase.json'); if(x.hosting.public !== 'cloudflare/public') process.exit(1)"

      - name: Verify Cloudflare Worker can be bundled
        working-directory: cloudflare
        run: |
          npm install --no-audit --no-fund
          npx wrangler deploy --dry-run --outdir dist
