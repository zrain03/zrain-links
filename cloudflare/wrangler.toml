# BM: Konfigurasi Worker dan binding D1.
# EN: Worker deployment and D1 binding configuration.

name = "zrain-links"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "zrain-links-db"
database_id = "3ea6ed8a-e6f9-4199-a13b-fab44876dbf9"
migrations_dir = "migrations"
