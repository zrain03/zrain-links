spring:
  application:
    name: zrain-links
  profiles:
    default: local
  jpa:
    open-in-view: false
  h2:
    console:
      enabled: false

zrain:
  jwt:
    secret-base64: ${ZRAIN_JWT_SECRET_BASE64:}
    issuer: ${ZRAIN_JWT_ISSUER:zrain-links}
    audience: ${ZRAIN_JWT_AUDIENCE:zrain-links-api}
    access-minutes: ${ZRAIN_JWT_ACCESS_MINUTES:15}

server:
  error:
    include-message: never
    include-stacktrace: never

springdoc:
  swagger-ui:
    enabled: true

zrain-links:
  base-url: ${ZRAIN_LINKS_BASE_URL:http://localhost:8080}
  short-base-url: ${ZRAIN_LINKS_SHORT_BASE_URL:}
