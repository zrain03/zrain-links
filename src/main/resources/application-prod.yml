# BM: Konfigurasi framework dan pipeline.
# EN: Framework and pipeline configuration.

spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_JDBC_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

server:
  address: 0.0.0.0
  port: ${PORT:10000}
  forward-headers-strategy: framework

zrain-links:
  base-url: ${ZRAIN_LINKS_BASE_URL}
  short-base-url: ${ZRAIN_LINKS_SHORT_BASE_URL:}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
